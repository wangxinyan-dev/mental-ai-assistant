spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:请填写数据库密码}
    hikari:
      pool-name: MentalHealthHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
  ai:
    openai:
      chat:
        options:
          model: ${AI_MODEL:deepseek-ai/DeepSeek-V3}
        completions-path: /v1/chat/completions
      api-key: ${AI_API_KEY:请填写AI服务API密钥}
      base-url: ${AI_BASE_URL:https://api.siliconflow.cn}
      embedding:
        enabled: false  # 禁用自动配置的Embedding（DeepSeek不支持），使用自定义EmbeddingConfig
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 操作审计日志分区保留策略（保留最近 N 个月，更早的按月 DROP PARTITION）
audit-log:
  partition:
    retention-months: ${AUDIT_LOG_RETENTION_MONTHS:12}

file:
  upload:
    path: ./uploads

server:
  port: ${SERVER_PORT:1236}

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: 86400000
  refresh-expiration: 604800000
  header: Authorization
  token-prefix: "Bearer "

# RAG 检索增强生成配置
rag:
  # Embedding API（独立于Chat的DeepSeek，因DeepSeek不支持Embedding）
  # 当前默认使用 SiliconFlow（免费），只需设置 EMBEDDING_API_KEY 环境变量即可
  # 其他可选提供商：
  #   阿里云通义千问: base-url=https://dashscope.aliyuncs.com/compatible-mode  model=text-embedding-v3
  #   OpenAI:         base-url=https://api.openai.com                          model=text-embedding-3-small
  #   SiliconFlow:    base-url=https://api.siliconflow.cn                      model=BAAI/bge-large-zh-v1.5
  embedding:
    base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}
    # Embedding API 调用重试（对抗免费 API 瞬时限流/5xx）：指数退避，耗尽后跳过整批
    # max-attempts: 重试次数含首次调用；initial-backoff-ms: 第 1 次失败后等待的初始间隔，之后每次翻倍
    retry:
      max-attempts: ${EMBEDDING_RETRY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${EMBEDDING_RETRY_INITIAL_BACKOFF_MS:500}
  # 向量存储（PgVector，独立于MySQL的PostgreSQL向量数据库）
  vector-store:
    pg:
      url: ${PG_URL:jdbc:postgresql://localhost:5432/rag_vector}
      username: ${PG_USERNAME:postgres}
      password: ${PG_PASSWORD:change-me-in-production}
      dimension: 1024  # BAAI/bge-large-zh-v1.5 向量维度
