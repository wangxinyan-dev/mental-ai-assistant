spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:请填写数据库密码}
    hikari:
      pool-name: MentalHealthHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
  ai:
    openai:
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
        completions-path: /v1/chat/completions
      api-key: ${AI_API_KEY:请填写AI服务API密钥}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload:
    path: ./uploads

server:
  port: ${SERVER_PORT:1236}

jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWT2025!@#$%^&*()_+SecureKeyHere}
  expiration: 86400000
  refresh-expiration: 604800000
  header: Authorization
  token-prefix: "Bearer "
