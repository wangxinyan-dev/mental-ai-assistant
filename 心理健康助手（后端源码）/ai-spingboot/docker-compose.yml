version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mental-health-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: mental_health_assistant
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql  # 自动建表
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: mental-health-backend
    ports:
      - "1236:1236"
    environment:
      SERVER_PORT: 1236
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AI_API_KEY: ${AI_API_KEY:-you-key}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads

volumes:
  mysql-data:
  uploads-data:
