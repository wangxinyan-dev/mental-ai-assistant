server {
    listen 80;
    server_name _;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩，加快传输
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 上传文件大小限制（与后端保持一致）
    client_max_body_size 10m;

    # Vue history 路由：刷新非根路径时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到后端服务
    # 注意：proxy_pass 末尾不带斜杠，保留完整的 /api 前缀（后端白名单按 /api/xxx 匹配）
    location /api/ {
        proxy_pass http://backend:1236;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式响应（AI 对话）需要关闭缓冲、延长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }

    # /uploads 反代到后端（图片等上传资源）
    location /uploads/ {
        proxy_pass http://backend:1236/uploads/;
        proxy_set_header Host $host;
    }

    # 静态资源长缓存（带 hash 的 js/css）
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
