# 心理健康助手 - 一体化部署
# 使用方式：
#   1. 复制 .env.example 为 .env 并填入 AI_API_KEY 等
#   2. docker compose up -d --build
#   3. 浏览器访问 http://服务器IP:8080  （本机部署即 http://localhost:8080）
name: mental-health

services:
  mysql:
    image: mysql:8.0
    container_name: mental-health-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: mental_health_assistant
      TZ: Asia/Shanghai
    # 不对外暴露端口，仅容器内网通信（backend 通过服务名 mysql:3306 访问）
    # 如需用 Navicat 连接查看数据，取消下行注释，改为 3307:3306
    # ports:
    #   - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/ai-spingboot/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgVector 向量数据库（RAG 语义检索）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mental-health-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-123456}
      POSTGRES_DB: rag_vector
      TZ: Asia/Shanghai
    # 不对外暴露端口，仅容器内网通信（backend 通过服务名 postgres:5432 访问）
    # 如需用 pgAdmin 等工具连接查看，取消下行注释，改为 5433:5432
    # ports:
    #   - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/ai-spingboot
      dockerfile: Dockerfile
    container_name: mental-health-backend
    restart: unless-stopped
    ports:
      - "1236:1236"
    environment:
      SERVER_PORT: 1236
      DB_URL: jdbc:mysql://mysql:3306/mental_health_assistant?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AI_API_KEY: ${AI_API_KEY:-you-key}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.siliconflow.cn}
      AI_MODEL: ${AI_MODEL:-deepseek-ai/DeepSeek-V3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}
      PG_URL: jdbc:postgresql://postgres:5432/rag_vector
      PG_USERNAME: postgres
      PG_PASSWORD: ${PG_PASSWORD:-123456}
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend/ai-vue
      dockerfile: Dockerfile
    container_name: mental-health-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  pg-data:
  uploads-data:
